# Configuración de Fly.io. Las variables con claves van como secretos
# (fly secrets set CLAVE=valor); NODE_ENV y PORT ya los fija el Dockerfile.
app = "yapacode-market-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  # Una sola máquina, siempre prendida: sin arranques en frío y con los
  # límites de @nestjs/throttler en memoria.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
